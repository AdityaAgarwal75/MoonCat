name: MoonCat TV D-pad verification
on:
  push:
    branches: [verify/tv-dpad]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI_USE_DEBUG_SIGNING: "true"
      DOVI_NATIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build emulator APKs
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug :app:assembleFullDebugAndroidTest -PmooncatAbi=x86_64 --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCat-TV-emulator-apks
          path: |
            app/build/outputs/apk/full/debug/*.apk
            app/build/outputs/apk/androidTest/full/debug/*.apk
  remote-ui:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MoonCat-TV-emulator-apks
          path: /tmp/tv-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          script: |
            adb install -r "$(find /tmp/tv-apks/full/debug -name '*.apk' -print -quit)"
            adb install -r "$(find /tmp/tv-apks/androidTest/full/debug -name '*.apk' -print -quit)"
            adb shell am instrument -w -e class com.nuvio.tv.ui.screens.discovery.MooncatDiscoveryUiTest dev.mooncat.tv.debug.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/mooncat-ui-results.txt
            mkdir -p ui-results
            adb root
            adb wait-for-device
            adb pull /data/user/0/dev.mooncat.tv.debug/files/screenshots ui-results/ || true
            cp /tmp/mooncat-ui-results.txt ui-results/
            grep -q 'OK (2 tests)' /tmp/mooncat-ui-results.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: MoonCat-TV-Dpad-screenshots
          path: ui-results/
