name: MoonCat Home preview
on:
  push:
    branches: [work/mooncat-home]
    paths: ['home-preview/**', '.github/workflows/mooncat-home.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build lightweight native launcher
        env:
          KEYSTORE: ${{ secrets.MOONCAT_V2_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MOONCAT_V2_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOONCAT_V2_KEY_ALIAS }}
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          "$SDKMANAGER" 'platforms;android-28' 'build-tools;36.0.0'
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p /tmp/home-build/classes /tmp/home-build/dex dist
          "$TOOL/aapt2" compile --dir home-preview/res -o /tmp/home-build/resources.zip
          "$TOOL/aapt2" link -o /tmp/home-build/base.apk --manifest home-preview/AndroidManifest.xml -I "$ANDROID_HOME/platforms/android-28/android.jar" /tmp/home-build/resources.zip
          javac --release 8 -classpath "$ANDROID_HOME/platforms/android-28/android.jar" -d /tmp/home-build/classes home-preview/src/dev/mooncat/home/MainActivity.java
          jar cf /tmp/home-build/classes.jar -C /tmp/home-build/classes .
          "$TOOL/d8" --min-api 24 --lib "$ANDROID_HOME/platforms/android-28/android.jar" --output /tmp/home-build/dex /tmp/home-build/classes.jar
          cp /tmp/home-build/base.apk /tmp/home-build/app.apk
          (cd /tmp/home-build/dex && zip -q /tmp/home-build/app.apk classes.dex)
          "$TOOL/zipalign" -f 4 /tmp/home-build/app.apk /tmp/home-build/aligned.apk
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 -d > /tmp/home-build/key.jks
          chmod 600 /tmp/home-build/key.jks
          "$TOOL/apksigner" sign --ks /tmp/home-build/key.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:STORE_PASSWORD --out dist/MoonCat-Home-v0.1.0.apk /tmp/home-build/aligned.apk
          "$TOOL/apksigner" verify --verbose dist/MoonCat-Home-v0.1.0.apk
          "$TOOL/aapt" dump badging dist/MoonCat-Home-v0.1.0.apk
          sha256sum dist/*.apk > dist/SHA256SUMS
          rm -f /tmp/home-build/key.jks
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCat-Home-preview
          path: dist/
