name: Build MoonCat updates
on:
  workflow_dispatch:
  push:
    tags: ['build-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore stable release signing identity
        env:
          KEYSTORE: ${{ secrets.MOONCAT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MOONCAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOONCAT_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          assert all(os.environ.get(k) for k in ['KEYSTORE','STORE_PASSWORD','KEY_ALIAS']),'Configure the three MoonCat signing secrets before building updates.'
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'mooncat-release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE']))
          props={'sdk.dir':os.environ['ANDROID_HOME'],'NUVIO_RELEASE_STORE_FILE':str(key),'NUVIO_RELEASE_KEY_ALIAS':os.environ['KEY_ALIAS'],'NUVIO_RELEASE_KEY_PASSWORD':os.environ['STORE_PASSWORD'],'NUVIO_RELEASE_STORE_PASSWORD':os.environ['STORE_PASSWORD'],'DOVI_NATIVE_ENABLED':'false'}
          pathlib.Path('local.properties').write_text(''.join(k+'='+v+'\n' for k,v in props.items()))
          PY
      - name: Test and build signed APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testFullDebugUnitTest :app:lintFullRelease :app:assembleFullRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCat-signed-APK
          path: app/build/outputs/apk/full/release/*.apk
      - name: Publish update
        if: startsWith(github.ref, 'refs/tags/build-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#build-}"
          mkdir -p dist
          cp app/build/outputs/apk/full/release/*.apk dist/MoonCat-armeabi-v7a.apk
          cd dist
          sha256sum MoonCat-armeabi-v7a.apk > SHA256SUMS
          gh release create "$tag" MoonCat-armeabi-v7a.apk SHA256SUMS --title "MoonCat $tag" --generate-notes --target "$GITHUB_SHA"
