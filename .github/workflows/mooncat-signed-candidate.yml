name: MoonCat Signed TV and Mobile Release Candidate

on:
  push:
    branches: [build/mooncat-v102-android-verify]
    paths: [.github/workflows/mooncat-signed-candidate.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    name: Build, verify, and publish signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore original signing identity from GitHub secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MOONCAT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOONCAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOONCAT_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          required=['KEYSTORE_BASE64','KEYSTORE_PASSWORD','KEY_ALIAS']
          if not all(os.environ.get(k) for k in required):
              raise SystemExit("Signing secrets not configured. Refusing to create an incompatible APK.")
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'mooncat-original.jks'
          out.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64']))
          out.chmod(0o600)
          p={
            'NUVIO_RELEASE_STORE_FILE':str(out),
            'NUVIO_RELEASE_KEY_ALIAS':os.environ['KEY_ALIAS'],
            'NUVIO_RELEASE_KEY_PASSWORD':os.environ['KEYSTORE_PASSWORD'],
            'NUVIO_RELEASE_STORE_PASSWORD':os.environ['KEYSTORE_PASSWORD'],
            'DOVI_NATIVE_ENABLED':'false'
          }
          pathlib.Path('local.properties').write_text(''.join(k+'='+v+'\n' for k,v in p.items()))
          pathlib.Path('local.properties').chmod(0o600)
          PY

      - name: Test MoonCat-specific logic
        run: |
          chmod +x gradlew
          ./gradlew :app:testFullReleaseUnitTest \
            --tests "com.nuvio.tv.core.mooncat.*" \
            --tests "com.nuvio.tv.core.catalog.*" \
            --tests "com.nuvio.tv.ui.screens.player.AudioLanguageChoicesTest" \
            --tests "com.nuvio.tv.ui.screens.player.AudioSourceIdentityTest" \
            --no-daemon --max-workers=1 --console=plain -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Build signed TV and mobile releases
        run: |
          ./gradlew :app:assembleFullRelease :mobile:assembleRelease \
            -x lintVitalFullRelease -x lintVitalAnalyzeFullRelease -x lintVitalReportFullRelease \
            --no-daemon --max-workers=1 --console=plain -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Align, sign, and verify mobile and TV identities
        shell: bash
        env:
          KEYPASS: ${{ secrets.MOONCAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOONCAT_KEY_ALIAS }}
        run: |
          set -euo pipefail
          TOOL="$ANDROID_HOME/build-tools/36.0.0"
          TV="$(find app/build/outputs/apk/full/release -name '*.apk' -print -quit)"
          UNSIGNED="$(find mobile/build/outputs/apk/release -name '*unsigned*.apk' -print -quit)"
          test -s "$TV"; test -s "$UNSIGNED"
          mkdir -p dist
          cp "$TV" dist/MoonCat-TV-v1.0.3.apk
          "$TOOL/zipalign" -f -p 4 "$UNSIGNED" /tmp/mooncat-mobile-aligned.apk
          "$TOOL/apksigner" sign \
            --ks "$RUNNER_TEMP/mooncat-original.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYPASS --key-pass env:KEYPASS \
            --out dist/MoonCat-Mobile-v1.0.3.apk /tmp/mooncat-mobile-aligned.apk
          for apk in dist/*.apk; do
            "$TOOL/apksigner" verify --verbose "$apk"
            actual="$("$TOOL/apksigner" verify --print-certs "$apk" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')"
            test "$actual" = "6341008335cc94f1dba060680dbedafd59ba5d5ef8017d09ff8757cccdd0ec0c"
          done
          "$TOOL/aapt" dump badging dist/MoonCat-TV-v1.0.3.apk | grep -E "package: name='dev.mooncat.tv' versionCode='10004'"
          "$TOOL/aapt" dump badging dist/MoonCat-Mobile-v1.0.3.apk | grep -E "package: name='dev.mooncat.mobile' versionCode='10004'"
          cd dist
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: MoonCat-v1.0.3-signed-TV-and-Mobile
          path: dist/
          retention-days: 30

      - name: Publish GitHub pre-release after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.3-rc1 \
            dist/MoonCat-TV-v1.0.3.apk dist/MoonCat-Mobile-v1.0.3.apk dist/SHA256SUMS \
            --title "MoonCat v1.0.3 RC1 — TV & Android" \
            --notes "Signed release candidate. Full device playback verification still required. Mobile is an early beta with limited movie-source support." \
            --prerelease --target "$GITHUB_SHA"
