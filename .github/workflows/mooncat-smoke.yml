name: MoonCat optimized-release emulator smoke
on:
  push:
    branches: [fix/fire-tv-autoplay-v1.0.7]
    paths: ['app/**', 'scripts/**', '.github/workflows/mooncat-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mooncat-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_USE_DEBUG_SIGNING: 'true'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build optimized x86 preview
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
          chmod +x gradlew
          ./gradlew :app:assembleFullRelease -PmooncatPreview=true -PmooncatAbi=x86 --no-daemon --max-workers=2 --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/emulator_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MoonCat-release-smoke
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 14
