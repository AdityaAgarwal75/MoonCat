name: Publish original-key MoonCat TV update
on:
  push:
    branches: [main, improve/tv-discovery-playback]
    paths: [mooncat/tv-release.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verification tools
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          "$SDKMANAGER" "build-tools;36.0.0"
      - name: Verify original TV identity and checksum
        id: release
        run: python3 scripts/publish_tv_release.py
      - name: Publish installable TV update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS --verify-tag=false --target "$GITHUB_SHA" --title "MoonCat TV $RELEASE_TAG" --notes-file mooncat/TV-RELEASE-NOTES.md
