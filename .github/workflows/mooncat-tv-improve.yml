name: MoonCat TV build and regression tests
on:
  push:
    branches: [improve/tv-discovery-playback]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mooncat-tv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_UNSIGNED_RELEASE: "true"
      DOVI_NATIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate packaged catalogues and branding
        run: python3 scripts/validate_tv_assets.py
      - name: TV regression tests
        run: |
          chmod +x gradlew
          printf 'TRAKT_CLIENT_ID=mooncat-ci-fixture\nTRAKT_CLIENT_SECRET=mooncat-ci-fixture\n' > local.properties
          ./gradlew :app:testFullReleaseUnitTest --no-daemon --max-workers=2 --console=plain -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          rm local.properties
      - name: Compile unsigned release for original-key signing
        run: ./gradlew :app:assembleFullRelease --no-daemon --max-workers=2 --console=plain -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Verify TV package metadata
        run: |
          APK="$(find app/build/outputs/apk/full/release -name '*unsigned*.apk' -print -quit)"
          test -s "$APK"
          python3 scripts/validate_packaged_catalogues.py "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='dev.mooncat.tv' versionCode='10005'"
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCat-TV-v1.0.4-unsigned
          path: app/build/outputs/apk/full/release/*unsigned*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: MoonCat-TV-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
  discovery-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI_USE_DEBUG_SIGNING: "true"
      DOVI_NATIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build emulator test APKs
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug :app:assembleFullDebugAndroidTest -PmooncatAbi=x86_64 --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Exercise studio and news screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          script: |
            adb install -r "$(find app/build/outputs/apk/full/debug -name '*.apk' -print -quit)"
            adb install -r "$(find app/build/outputs/apk/androidTest/full/debug -name '*.apk' -print -quit)"
            adb shell am instrument -w -e class com.nuvio.tv.ui.screens.discovery.MooncatDiscoveryUiTest dev.mooncat.tv.debug.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/mooncat-ui-results.txt
            mkdir -p ui-results
            adb exec-out run-as dev.mooncat.tv.debug tar -cf - -C files screenshots > ui-results/screenshots.tar || true
            tar -xf ui-results/screenshots.tar -C ui-results || true
            cp /tmp/mooncat-ui-results.txt ui-results/
            grep -q 'OK (2 tests)' /tmp/mooncat-ui-results.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: MoonCat-TV-UI-screenshots
          path: ui-results/
